name: "Sync Upstream actions/runner Release"

on:
  schedule:
    - cron: "0 0 * * 1" # Runs weekly every Monday at 00:00 UTC
  workflow_dispatch:
    inputs:
      force_sync_tag:
        description: "Optional specific tag to sync (e.g. v2.336.0)"
        required: false
        default: ""

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check upstream release status
        id: check
        run: |
          # Add upstream remote and fetch all tags
          git remote add upstream https://github.com/actions/runner.git || true
          git fetch upstream --tags

          # Determine target release tag
          if [ -n "${{ github.event.inputs.force_sync_tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.force_sync_tag }}"
            echo "Using specified tag: $TARGET_TAG"
          else
            TARGET_TAG=$(curl -s https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name')
            if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
              echo "GitHub API release query returned empty; checking git tags..."
              TARGET_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            fi
          fi

          echo "Target upstream release tag is: $TARGET_TAG"
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_OUTPUT

          # Fetch branches
          git fetch origin main google-main

          # 1. Check if main branch is already up to date with tag
          git checkout main
          git pull origin main
          if git merge-base --is-ancestor "$TARGET_TAG" main; then
            echo "main branch is already up to date with $TARGET_TAG."
            echo "MAIN_NEEDS_SYNC=false" >> $GITHUB_OUTPUT
          else
            echo "main branch needs to be synced with $TARGET_TAG."
            echo "MAIN_NEEDS_SYNC=true" >> $GITHUB_OUTPUT
          fi

          # 2. Check if google-main already contains this release tag
          git checkout google-main
          git pull origin google-main
          if git merge-base --is-ancestor "$TARGET_TAG" google-main; then
            echo "google-main already contains $TARGET_TAG. Fully synced!"
            echo "GOOGLE_MAIN_NEEDS_SYNC=false" >> $GITHUB_OUTPUT
          else
            echo "google-main does not contain $TARGET_TAG yet. PR needed."
            echo "GOOGLE_MAIN_NEEDS_SYNC=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync main branch with release tag
        if: steps.check.outputs.MAIN_NEEDS_SYNC == 'true'
        run: |
          TARGET_TAG="${{ steps.check.outputs.TARGET_TAG }}"
          git checkout main
          git merge "$TARGET_TAG" -m "Merge tag '$TARGET_TAG' into main"
          git push origin main

      - name: Create or update PR into google-main
        if: steps.check.outputs.GOOGLE_MAIN_NEEDS_SYNC == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.check.outputs.TARGET_TAG }}
        run: |
          SYNC_BRANCH="sync/upstream-${TARGET_TAG}"
          git checkout main
          git checkout -B "$SYNC_BRANCH"
          git push --force origin "$SYNC_BRANCH"

          # Test merge to check for conflicts
          git checkout "$SYNC_BRANCH"
          HAS_CONFLICTS=false
          CONFLICT_FILES=""
          if ! git merge origin/google-main --no-commit --no-ff; then
            HAS_CONFLICTS=true
            echo "Merge conflicts detected against google-main."
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            git merge --abort || true
          else
            git merge --abort || true
          fi

          PR_TITLE="Sync upstream release ${TARGET_TAG} into google-main"
          cat > pr_body.md << EOF
          Automated weekly synchronization with official upstream [actions/runner](https://github.com/actions/runner) release [${TARGET_TAG}](https://github.com/actions/runner/releases/tag/${TARGET_TAG}).

          ### Details:
          - Upstream Release: [${TARGET_TAG}](https://github.com/actions/runner/releases/tag/${TARGET_TAG})
          - Base Branch: \`google-main\`
          - Head Branch: \`${SYNC_BRANCH}\`
          EOF

          if [ "$HAS_CONFLICTS" = "true" ]; then
            cat >> pr_body.md << EOF

          > [!WARNING]
          > **Merge conflicts detected in the following files:**
          $(echo "$CONFLICT_FILES" | sed 's/^/- `/;s/$/`/')

          **Resolution Steps:**
          1. \`git checkout ${SYNC_BRANCH}\`
          2. \`git merge google-main\`
          3. Resolve conflicts (or ask the AI assistant), run tests, and push.
          EOF
          else
            cat >> pr_body.md << EOF

          > [!NOTE]
          > Clean merge without conflicts. Ready for CI verification and review.
          EOF
          fi

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base google-main --head "$SYNC_BRANCH" --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base google-main \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body-file pr_body.md \
              --label "dependencies"
          else
            echo "PR #$EXISTING_PR already exists for $SYNC_BRANCH. Updating title and description..."
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file pr_body.md
          fi
